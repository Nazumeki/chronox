name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_cargo: ${{ steps.version.outputs.publish_cargo }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tag against Cargo.toml
        id: version
        shell: python {0}
        run: |
          import os
          import re
          import tomllib

          tag = os.environ['GITHUB_REF_NAME']
          tag_pattern = r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc)(\.(0|[1-9][0-9]*))?)?'
          if not re.fullmatch(tag_pattern, tag):
              raise SystemExit(
                  f'Invalid release tag: {tag}. Expected vMAJOR.MINOR.PATCH '
                  'with an optional -beta[.N] or -rc[.N] suffix.'
              )
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['package']['version']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} must match Cargo.toml version v{version}')
          prerelease = '-' in version
          publish_cargo = version.startswith('1.') and not prerelease
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'prerelease={str(prerelease).lower()}\n')
              output.write(f'publish_cargo={str(publish_cargo).lower()}\n')

  checks:
    name: CI
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      ASSET_NAME: chronox-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          save-if: false
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "target/$TARGET/release/chronox" --version
          mkdir -p "dist/$ASSET_NAME"
          cp "target/$TARGET/release/chronox" LICENSE README.md README.zh-CN.md "dist/$ASSET_NAME/"
          tar -czf "dist/$ASSET_NAME.tar.gz" -C dist "$ASSET_NAME"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/$env:TARGET/release/chronox.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path "dist/$env:ASSET_NAME" -Force
          Copy-Item "target/$env:TARGET/release/chronox.exe", LICENSE, README.md, README.zh-CN.md "dist/$env:ASSET_NAME/"
          Compress-Archive -Path "dist/$env:ASSET_NAME" -DestinationPath "dist/$env:ASSET_NAME.zip"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: sha256sum *.tar.gz *.zip > SHA256SUMS
        working-directory: dist
      - name: Publish release with archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"

  crates_io:
    name: Publish crates.io package
    if: needs.validate.outputs.publish_cargo == 'true'
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked --package chronox
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
