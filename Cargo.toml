[package]
name = "chronox"
version = "0.1.2"
edition = "2024"
description = "Automatically recognize and convert timestamps and date strings"
license = "MIT"

[dependencies]
anstream = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6", features = ["derive"] }
